<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Cyan to Blue Tech Gradient -->
    <linearGradient id="techGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Glowing Drop Shadow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Tech Shield Container -->
  <polygon points="100,10 175,45 175,155 100,190 25,155 25,45" 
           fill="#131b2e" 
           stroke="url(#techGlow)" 
           stroke-width="3" 
           stroke-linejoin="round"/>

  <!-- Circuit Blueprint Nodes & Grid Marks -->
  <circle cx="100" cy="10" r="3" fill="#38bdf8" />
  <circle cx="175" cy="45" r="3" fill="#38bdf8" />
  <circle cx="175" cy="155" r="3" fill="#38bdf8" />
  <circle cx="100" cy="190" r="3" fill="#38bdf8" />
  <circle cx="25" cy="155" r="3" fill="#38bdf8" />
  <circle cx="25" cy="45" r="3" fill="#38bdf8" />

  <!-- Monogram Initials "SA" Intersecting Path -->
  <g filter="url(#neonGlow)">
    <!-- Letter 'S' Contour -->
    <path d="M 82 72 L 58 72 L 58 96 L 82 104 L 82 128 L 54 128" 
          fill="none" 
          stroke="url(#techGlow)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Letter 'A' Contour -->
    <path d="M 112 128 L 128 68 L 144 128" 
          fill="none" 
          stroke="url(#techGlow)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Letter 'A' Crossbar & Connector -->
    <line x1="119" y1="104" x2="137" y2="104" 
          stroke="#f1f5f9" 
          stroke-width="5" 
          stroke-linecap="round" />

    <!-- Connection Node Point -->
    <circle cx="82" cy="72" r="4" fill="#f1f5f9" />
    <circle cx="128" cy="68" r="4" fill="#38bdf8" />
  </g>
</svg>
